[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sidecardb"
version = "3.0.0"
description = "Ask a PostgreSQL database a question in plain English and get the rows back."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "sidecardb contributors" }]
keywords = ["nl2sql", "postgres", "llm", "search", "rag", "natural-language"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.31,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "asyncpg>=0.29,<1.0",
    "sqlglot>=25.20,<31.0",
    "langchain-openai>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
# Local embedding models via sentence-transformers (pulls in torch; several GB).
# The default "api" provider needs none of this.
embeddings = ["sentence-transformers>=3.0,<7.0"]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "build>=1.2.0",
]

[project.scripts]
sidecardb = "core.cli:main"

[project.urls]
Homepage = "https://github.com/karolelalit44/poc-db-nl-search"
Repository = "https://github.com/karolelalit44/poc-db-nl-search"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/infra", "src/utils"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["local"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "DTZ", "T20", "ASYNC", "LOG", "G", "PIE", "RET", "PERF"]

[tool.ruff.lint.per-file-ignores]
"src/core/cli.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["core", "infra", "utils"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["infra.llm", "infra.db", "infra.embeddings"]
disallow_untyped_defs = false
