[project]
name = "poc-db-nl-search"
version = "0.1.0"
description = "Generic NL-to-SQL Search Engine over Relational Databases (PostgreSQL 16 + pgvector)"
readme = "01_ARCHITECTURE_AND_SYSTEM_DESIGN.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.29.0",
    "sqlglot>=25.20.0",
    "pgvector>=0.3.5",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
