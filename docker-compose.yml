services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-investigation_db}
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-postgres_master_secret}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - ./artifacts/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
      - ./artifacts/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
      - ./artifacts/setup_roles.sql:/docker-entrypoint-initdb.d/03_setup_roles.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 4s
      timeout: 4s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-nl_search_user}:${DB_PASSWORD:-nl_search_pass_secret}@postgres:5432/${DB_NAME:-investigation_db}
      DB_SCHEMA: public
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
