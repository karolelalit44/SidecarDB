# Demo stack: PostgreSQL with sample data plus the sidecarDB service.
#
# Copy .env.example to .env and set DB_ADMIN_PASSWORD, DB_PASSWORD and the LLM
# credentials before starting. Passwords are required on purpose; no default
# credential is committed to this repository.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sidecardb_demo}
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env (see .env.example)}
      NL_SEARCH_USER: ${DB_USER:-nl_search_user}
      NL_SEARCH_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - ./artifacts/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
      - ./artifacts/seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
      - ./src/ops/setup_roles.sh:/docker-entrypoint-initdb.d/03_setup_roles.sh:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 4s
      timeout: 4s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-nl_search_user}:${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}@postgres:5432/${DB_NAME:-sidecardb_demo}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
